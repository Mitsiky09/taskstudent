name: taskstudent_app
description: >-
  Application Flutter TaskStudent : architecture MVVM, état géré par Riverpod 3,
  persistance locale Hive CE. La logique métier vit dans taskstudent_core.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # État (MVVM : les ViewModel sont des Notifier Riverpod 3).
  # ^3.0.0 résout la dernière 3.x disponible sur pub.dev : Riverpod 3 unifie
  # Notifier/AutoDisposeNotifier/FamilyNotifier et supprime le paramètre
  # générique de Ref. StateProvider et StateNotifierProvider sont devenus
  # « legacy » (import flutter_riverpod/legacy.dart) : ce projet ne les
  # utilise pas.
  flutter_riverpod: ^3.0.0

  # Persistance locale. Le paquet `hive` d'origine n'est plus maintenu par son
  # auteur ; `hive_ce` (Community Edition) en est la continuation, avec la même
  # API. hive_ce 2.19.3 est la dernière version publiée (février 2026).
  hive_ce: ^2.19.0

  # Dossier de stockage de l'application, pour Hive.init().
  path_provider: ^2.1.0

  # Logique métier pure (modèles, filtres, stats, migration, export).
  taskstudent_core:
    path: ../taskstudent_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
