name: taskstudent_core
description: >-
  Noyau métier de TaskStudent (modèles, logique de tâches, dates, migration,
  export). Porté depuis l'application Expo/React Native. Aucun import Flutter :
  le paquet se teste avec `dart test` seul.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.5.0

# Aucune dépendance d'exécution volontairement :
# - le formatage français des dates est porté à la main (lib/src/logic/dates.dart),
#   ce qui évite `intl` et son initialisation de locale ;
# - le stockage est une interface (lib/src/storage.dart) : l'implémentation
#   `shared_preferences` viendra avec la couche applicative Flutter.
dependencies: {}

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
